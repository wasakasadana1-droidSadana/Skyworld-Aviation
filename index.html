<<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sri Lanka Flight Price Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #0077b6;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        select, input, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background: #0077b6;
            color: white;
            border: none;
            margin-top: 25px;
            cursor: pointer;
        }

        button:hover {
            background: #023e8a;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #e0f7fa;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
        }

        .note {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>✈️ Flight Price Calculator</h1>

    <p style="text-align:center;">
        ශ්‍රී ලංකාවට යන Flight එකේ ගාණ ගණනය කරන්න.
    </p>

    <label for="from">යන තැන (From)</label>

    <select id="from">
        <option value="">යන රට තෝරන්න</option>
        <option value="Dubai">Dubai</option>
        <option value="India">India</option>
        <option value="London">London</option>
        <option value="Singapore">Singapore</option>
        <option value="Malaysia">Malaysia</option>
        <option value="Qatar">Qatar</option>
        <option value="Japan">Japan</option>
        <option value="Australia">Australia</option>
        <option value="Thailand">Thailand</option>
    </select>

    <label for="to">බහින තැන (To)</label>

    <select id="to">
        <option value="Colombo">Colombo, Sri Lanka (CMB)</option>
    </select>

    <label for="passengers">මගීන් ගණන</label>

    <input type="number" id="passengers"
           value="1" min="1" max="20">

    <button onclick="calculatePrice()">
        ගාණ Calculate කරන්න
    </button>

    <div id="result">
        ගාණ මෙතන පෙන්වයි.
    </div>

    <p class="note">
        මෙය උදාහරණ මිල ගණන් මත පදනම් වූ Calculator එකකි.
        සැබෑ Flight Ticket මිල ගණන් නොවේ.
    </p>

</div>

<script>
    // උදාහරණ මිල ගණන් (එක් මගියෙකුට, LKR)
    const prices = {
        Dubai: 85000,
        India: 45000,
        London: 220000,
        Singapore: 90000,
        Malaysia: 75000,
        Qatar: 95000,
        Japan: 150000,
        Australia: 180000,
        Thailand: 65000
    };

    function calculatePrice() {

        const from = document.getElementById("from").value;
        const to = document.getElementById("to").value;

        const passengers = Number(
            document.getElementById("passengers").value
        );

        const result = document.getElementById("result");

        if (!from) {
            result.innerHTML = "කරුණාකර යන රට තෝරන්න.";
            return;
        }

        if (!Number.isInteger(passengers) ||
            passengers < 1 || passengers > 20) {
            result.innerHTML = "මගීන් ගණන 1 සිට 20 දක්වා ඇතුළත් කරන්න.";
            return;
        }

        const ticketPrice = prices[from];

        const total = ticketPrice * passengers;

        result.innerHTML = `
            <h3>✈️ Flight Details</h3>
            <p>From: ${from}</p>
            <p>To: ${to}</p>
            <p>එක් Ticket එකක්: LKR ${ticketPrice.toLocaleString()}</p>
            <hr>
            <h2>මුළු ගාණ: LKR ${total.toLocaleString()}</h2>
            <p>මගීන් ගණන: ${passengers}</p>
        `;
    }
</script>

</body>
</html>
