<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyworld Aviation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172b4d;
        }

        header {
            background: #002855;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            font-size: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 8px;
            font-size: 14px;
        }

        .hero {
            min-height: 430px;
            padding: 70px 20px;
            text-align: center;
            color: white;
            background:
                linear-gradient(#001d3dcc, #001d3dcc),
                url("https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1600&q=80");
            background-size: cover;
            background-position: center;
        }

        .hero h2 {
            font-size: 42px;
            margin: 45px 0 15px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .button {
            display: inline-block;
            background: #ffcc33;
            color: #002855;
            padding: 13px 24px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .booking {
            background: white;
            max-width: 950px;
            margin: -35px auto 40px;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #00000015;
            position: relative;
        }

        .booking h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd5e0;
            border-radius: 5px;
            font-size: 15px;
        }

        .search-button {
            margin-top: 20px;
            width: 100%;
            background: #0077b6;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        section {
            padding: 35px 20px;
            text-align: center;
        }

        section h2 {
            margin-bottom: 25px;
        }

        .destinations {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 12px #00000012;
            padding-bottom: 20px;
        }

        .card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
        }

        .card h3 {
            margin: 17px 0 8px;
        }

        .card p {
            color: #53657c;
            padding: 0 12px;
        }

        .about {
            background: #e5f3ff;
            padding: 45px 20px;
            line-height: 1.8;
        }

        footer {
            background: #002855;
            color: white;
            text-align: center;
            padding: 25px 15px;
            line-height: 2;
        }

        @media (max-width: 600px) {
            header {
                justify-content: center;
                text-align: center;
            }

            .hero h2 {
                font-size: 32px;
            }

            .booking {
                margin: 20px 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>✈ Skyworld Aviation</h1>

    <nav>
        <a href="#home">Home</a>
        <a href="#flights">Flights</a>
        <a href="#destinations">Destinations</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<div class="hero" id="home">
    <h2>Your Journey Begins Here</h2>
    <p>Discover the world with Skyworld Aviation.</p>
    <a href="#flights" class="button">Book Your Journey</a>
</div>

<div class="booking" id="flights">
    <h2>✈ Search Your Flight</h2>

    <form id="flightForm">
        <div class="form-grid">

            <div>
                <label for="from">From</label>
                <select id="from" required>
                    <option value="">Select city</option>
                    <option>Colombo (CMB)</option>
                    <option>London (LHR)</option>
                    <option>Dubai (DXB)</option>
                    <option>Singapore (SIN)</option>
                    <option>Tokyo (NRT)</option>
                </select>
            </div>

            <div>
                <label for="to">To</label>
                <select id="to" required>
                    <option value="">Select city</option>
                    <option>Colombo (CMB)</option>
                    <option>London (LHR)</option>
                    <option>Dubai (DXB)</option>
                    <option>Singapore (SIN)</option>
                    <option>Tokyo (NRT)</option>
                </select>
            </div>
