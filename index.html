<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skyworld Aviation</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #061426;
    color: white;
}

header {
    background: linear-gradient(135deg, #06315c, #00172f);
    text-align: center;
    padding: 35px 15px;
    border-bottom: 4px solid #ffcc00;
}

.creator {
    color: #ffcc00;
    font-size: 18px;
    margin-bottom: 12px;
}

.logo {
    font-size: 60px;
    margin: 10px;
}

h1 {
    color: #ffcc00;
    font-size: clamp(25px, 5vw, 42px);
    margin: 10px 0;
}

.subtitle {
    font-size: 19px;
    color: #dce8f5;
}

.languages {
    margin-top: 25px;
}

button {
    cursor: pointer;
    font-family: inherit;
}

.lang-btn {
    padding: 15px 22px;
    border: none;
    border-radius: 12px;
    margin: 5px;
    font-size: 17px;
    font-weight: bold;
    background: white;
    color: #12304e;
}

.lang-btn.active {
    background: #ffcc00;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.section-title {
    text-align: center;
    color: #ffcc00;
    font-size: 28px;
    margin: 35px 0 25px;
}

.categories {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 15px;
}

.category {
    background: #112a45;
    border: 2px solid #20476e;
    border-radius: 17px;
    padding: 22px 8px;
    text-align: center;
    color: white;
    font-size: 17px;
    font-weight: bold;
    min-height: 135px;
    transition: 0.2s;
}

.category:hover,
.category.active {
    background: #ffcc00;
    color: #071629;
    border-color: #ffcc00;
}

.category-icon {
    display: block;
    font-size: 38px;
    margin-bottom: 12px;
}

.news-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 35px;
}

.news-header h2 {
    color: #ffcc00;
    font-size: 25px;
    margin: 0;
}

.reset-btn {
    background: #ffcc00;
    color: #071629;
    padding: 12px 15px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: bold;
}

.search-box {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #315779;
    background: #112a45;
    color: white;
    font-size: 16px;
    margin-top: 20px;
    outline: none;
}

.search-box::placeholder {
    color: #a9bed3;
}

.status {
    color: #a9bed3;
    margin: 20px 0 12px;
}

.news-list {
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
}

.news-card {
    background: #112a45;
    border: 1px solid #244463;
    border-radius: 18px;
    padding: 20px;
    overflow-wrap: anywhere;
}

.news-category {
    color: #ffcc00;
    font-size: 14px;
    margin-bottom: 12px;
}

.news-card h3 {
    font-size: 21px;
    line-height: 1.6;
    margin: 0 0 12px;
}

.news-card p {
    color: #c1d1e0;
    line-height: 1.7;
    margin: 0 0 15px;
}

.news-date {
    color: #9bb1c7;
    font-size: 14px;
}

.empty {
    text-align: center;
    padding: 35px 15px;
    background: #112a45;
    border-radius: 15px;
    color: #c1d1e0;
}

footer {
    background: #020b16;
    border-top: 2px solid #ffcc00;
    text-align: center;
    padding: 25px 12px;
    color: #b8c9db;
    margin-top: 40px;
}

footer strong {
    color: #ffcc00;
}

@media (min-width: 700px) {
    .categories {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .news-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}
</style>
</head>

<body>

<header>

    <div class="creator" id="creator">
        Created by Sadana
    </div>

    <div class="logo">✈️</div>

    <h1>SKYWORLD AVIATION</h1>

    <div class="subtitle" id="subtitle">
        Explore the world of aviation
    </div>

    <div class="languages">

        <button class="lang-btn active"
                id="englishBtn"
                onclick="setLanguage('en')">
            🇬🇧 English
        </button>

        <button class="lang-btn"
                id="sinhalaBtn"
                onclick="setLanguage('si')">
            🇱🇰 සිංහල
        </button>

    </div>

</header>


<main class="container">

    <h2 class="section-title" id="categoryHeading">
        Aviation Categories
    </h2>

    <div class="categories">

        <button class="category active"
                onclick="selectCategory('World', this)">

            <span class="category-icon">🌍</span>
            <span data-en="World Aviation"
                  data-si="ලෝක ගුවන් සේවා">
                World Aviation
            </span>

        </button>


        <button class="category"
                onclick="selectCategory('Sri Lanka', this)">

            <span class="category-icon">🇱🇰</span>
            <span data-en="Sri Lanka Aviation"
                  data-si="ශ්‍රී ලංකා ගුවන් සේවා">
                Sri Lanka Aviation
            </span>

        </button>


        <button class="category"
                onclick="selectCategory('Airline', this)">

            <span class="category-icon">✈️</span>
            <span data-en="Airlines"
                  data-si="ගුවන් සමාගම්">
                Airlines
            </span>

        </button>


        <button class="category"
                onclick="selectCategory('Aircraft', this)">

            <span class="category-icon">🛫</span>
            <span data-en="Aircraft"
                  data-si="ගුවන් යානා">
                Aircraft
            </span>

        </button>


        <button class="category"
                onclick="selectCategory('Airport', this)">

            <span class="category-icon">🏢</span>
            <span data-en="Airports"
                  data-si="ගුවන් තොටුපළ">
                Airports
            </span>

        </button>


        <button class="category"
                onclick="selectCategory('Aviation Safety', this)">

            <span class="category-icon">🛡️</span>
            <span data-en="Aviation Safety"
                  data-si="ගුවන් ආරක්ෂාව">
                Aviation Safety
            </span>

        </button>

    </div>


    <div class="news-header">

        <h2 id="newsHeading">🌍 World Aviation News</h2>

        <button class="reset-btn" onclick="showAllNews()"
                id="allNewsBtn">
            🔄 Show All
        </button>

    </div>


    <input
        type="search"
        class="search-box"
        id="searchInput"
        placeholder="🔍 Search aviation news..."
        oninput="renderNews()"
    >


    <div class="status" id="newsStatus">
        Aviation news
    </div>


    <div class="news-list" id="newsList"></div>

</main>


<footer>

    <p>
        ✈️ <strong>SKYWORLD AVIATION</strong>
    </p>

    <p id="footerText">
        Your world of aviation
    </p>

    <p>
        Created by Sadana © <span id="year"></span>
    </p>

</footer>


<script>

/*
    SKY​​WORLD AVIATION

    Add your own verified aviation news
    inside the newsData array below.

    Every news item has:
    category, English title, Sinhala title,
    English description, Sinhala description
    and date.
*/


const newsData = [

    {
        category: "World",
        en: "Welcome to Skyworld Aviation",
        si: "Skyworld Aviation වෙත සාදරයෙන් පිළිගනිමු",
        descEn: "Discover aviation news from around the world. Add verified news articles to this website.",
        descSi: "ලොව පුරා ගුවන් සේවා පුවත් දැනගන්න. තහවුරු කළ පුවත් මෙම වෙබ් අඩවියට එක් කරන්න.",
        date: "2026-10-17"
    },

    {
        category: "Sri Lanka",
        en: "Sri Lanka Aviation News",
        si: "ශ්‍රී ලංකා ගුවන් සේවා පුවත්",
        descEn: "Read updates about aviation in Sri Lanka. Replace this sample with a verified news article.",
        descSi: "ශ්‍රී ලංකාවේ ගුවන් සේවා පිළිබඳ තොරතුරු කියවන්න. මෙය තහවුරු කළ පුවතකින් යාවත්කාලීන කරන්න.",
        date: "2026-10-17"
    },

    {
        category: "Airline",
        en: "Airline Industry Updates",
        si: "ගුවන් සමාගම් පිළිබඳ යාවත්කාලීන තොරතුරු",
        descEn: "Explore airline operations, services and industry developments.",
        descSi: "ගුවන් සමාගම්වල මෙහෙයුම්, සේවා සහ කර්මාන්තයේ වෙනස්කම් පිළිබඳ දැනගන්න.",
        date: "2026-10-17"
    },

    {
        category: "Aircraft",
        en: "Aircraft and Aviation Technology",
        si: "ගුවන් යානා සහ ගුවන් තාක්ෂණය",
        descEn: "Discover aircraft types, aviation technology and aircraft specifications.",
        descSi: "ගුවන් යානා වර්ග, ගුවන් තාක්ෂණය සහ යානා පිළිබඳ තොරතුරු සොයා බලන්න.",
        date: "2026-10-17"
    },

    {
        category: "Airport",
        en: "Airport Developments",
        si: "ගුවන් තොටුපළ සංවර්ධන තොරතුරු",
        descEn: "Read about airport facilities, services and infrastructure developments.",
        descSi: "ගුවන් තොටුපළ පහසුකම්, සේවා සහ යටිතල පහසුකම් පිළිබඳ තොරතුරු කියවන්න.",
        date: "2026-10-17"
    },

    {
        category: "Aviation Safety",
        en: "Aviation Safety Information",
        si: "ගුවන් ආරක්ෂාව පිළිබඳ තොරතුරු",
        descEn: "Learn about aviation safety practices and verified safety announcements.",
        descSi: "ගුවන් ආරක්ෂක ක්‍රියාමාර්ග සහ තහවුරු කළ ආරක්ෂක නිවේදන පිළිබඳ දැනගන්න.",
        date: "2026-10-17"
    }

];


let currentLanguage = "en";
let currentCategory = "World";


const translations = {

    en: {
        subtitle: "Explore the world of aviation",
        categoryHeading: "Aviation Categories",
        world: "World Aviation News",
        sriLanka: "Sri Lanka Aviation News",
        airline: "Airline News",
        aircraft: "Aircraft News",
        airport: "Airport News",
        safety: "Aviation Safety News",
        all: "All Aviation News",
        allButton: "🔄 Show All",
        search: "🔍 Search aviation news...",
        noNews: "No matching news found.",
        newsCount: "News articles",
        footer: "Your world of aviation",
        date: "Date",
        labels: {
            World: "World Aviation",
            "Sri Lanka": "Sri Lanka Aviation",
            Airline: "Airlines",
            Aircraft: "Aircraft",
            Airport: "Airports",
            "Aviation Safety": "Aviation Safety"
        }
    },

    si: {
        subtitle: "ගුවන් සේවා ලෝකය ගවේෂණය කරන්න",
        categoryHeading: "ගුවන් සේවා වර්ග",
        world: "ලෝක ගුවන් සේවා පුවත්",
        sriLanka: "ශ්‍රී ලංකා ගුවන් සේවා පුවත්",
        airline: "ගුවන් සමාගම් පුවත්",
        aircraft: "ගුවන් යානා පුවත්",
        airport: "ගුවන් තොටුපළ පුවත්",
        safety: "ගුවන් ආරක්ෂක පුවත්",
        all: "සියලුම ගුවන් සේවා පුවත්",
        allButton: "🔄 සියල්ල පෙන්වන්න",
        search: "🔍 ගුවන් සේවා පුවත් සොයන්න...",
        noNews: "ගැළපෙන පුවත් හමු වුණේ නැත.",
        newsCount: "පුවත් ගණන",
        footer: "ඔබේ ගුවන් සේවා ලෝකය",
        date: "දිනය",
        labels: {
            World: "ලෝක ගුවන් සේවා",
            "Sri Lanka": "ශ්‍රී ලංකා ගුවන් සේවා",
            Airline: "ගුවන් සමාගම්",
            Aircraft: "ගුවන් යානා",
            Airport: "ගුවන් තොටුපළ",
            "Aviation Safety": "ගුවන් ආරක්ෂාව"
        }
    }

};


function setLanguage(language) {

    currentLanguage = language;

    document.documentElement.lang = language;

    document.getElementById("englishBtn")
        .classList.toggle("active", language === "en");

    document.getElementById("sinhalaBtn")
        .classList.toggle("active", language === "si");

    document.getElementById("subtitle").textContent =
        translations[language].subtitle;

    document.getElementById("categoryHeading").textContent =
        translations[language].categoryHeading;

    document.getElementById("allNewsBtn").textContent =
        translations[language].allButton;

    document.getElementById("searchInput").placeholder =
        translations[language].search;

    document.getElementById("footerText").textContent =
        translations[language].footer;


    document.querySelectorAll("[data-en]").forEach(element => {

        element.textContent =
            element.getAttribute("data-" + language);

    });


    renderNews();

}


function selectCategory(category, button) {

    currentCategory = category;

    document.querySelectorAll(".category").forEach(item => {
        item.classList.remove("active");
    });

    button.classList.add("active");

    renderNews();

}


function showAllNews() {

    currentCategory = "All";

    document.querySelectorAll(".category").forEach(item => {
        item.classList.remove("active");
    });

    renderNews();

}


function renderNews() {

    const list = document.getElementById("newsList");

    const status = document.getElementById("newsStatus");

    const searchText = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const t = translations[currentLanguage];


    const headingNames = {
        World: t.world,
        "Sri Lanka": t.sriLanka,
        Airline: t.airline,
        Aircraft: t.aircraft,
        Airport: t.airport,
        "Aviation Safety": t.safety,
        All: t.all
    };


    document.getElementById("newsHeading").textContent =
        "✈️ " + headingNames[currentCategory];


    const filteredNews = newsData.filter(item => {

        const matchesCategory =
            currentCategory === "All" ||
            item.category === currentCategory;

        const title =
            currentLanguage === "si" ? item.si : item.en;

        const description =
            currentLanguage === "si"
                ? item.descSi
                : item.descEn;

        const matchesSearch =
            (title + " " + description + " " + item.category)
                .toLowerCase()
                .includes(searchText);

        return matchesCategory && matchesSearch;

    });


    list.innerHTML = "";


    if (filteredNews.length === 0) {

        list.innerHTML =
            '<div class="empty">' + t.noNews + '</div>';

        status.textContent = t.newsCount + ": 0";

        return;

    }


    status.textContent =
        t.newsCount + ": " + filteredNews.length;


    filteredNews.forEach(item => {

        const title =
            currentLanguage === "si" ? item.si : item.en;

        const description =
            currentLanguage === "si"
                ? item.descSi
                : item.descEn;


        const card = document.createElement("article");

        card.className = "news-card";


        const category = document.createElement("div");

        category.className = "news-category";

        category.textContent =
            "✈️ " + t.labels[item.category];


        const heading = document.createElement("h3");

        heading.textContent = title;


        const paragraph = document.createElement("p");

        paragraph.textContent = description;


        const date = document.createElement("div");

        date.className = "news-date";

        date.textContent = t.date + ": " + item.date;


        card.appendChild(category);
        card.appendChild(heading);
        card.appendChild(paragraph);
        card.appendChild(date);

        list.appendChild(card);

    });

}


document.getElementById("year").textContent =
    new Date().getFullYear();


setLanguage("en");

</script>

</body>
</html>
