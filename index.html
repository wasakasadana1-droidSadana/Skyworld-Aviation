<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skyworld Aviation</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #071426;
    color: white;
}

header {
    background: linear-gradient(135deg, #003566, #001d3d);
    text-align: center;
    padding: 28px 12px;
    border-bottom: 3px solid #ffc300;
}

.creator {
    color: #ffd60a;
    font-size: 14px;
    margin-bottom: 12px;
}

.logo {
    font-size: 42px;
}

header h1 {
    margin: 8px 0;
    font-size: 30px;
    color: #ffd60a;
}

header p {
    margin: 8px 0 0;
    color: #e6f1ff;
}

.languages {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    font-size: 15px;
    font-weight: bold;
}

.lang-btn {
    background: white;
    color: #003566;
}

.lang-btn.active {
    background: #ffc300;
    color: #001d3d;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 18px;
}

.section-title {
    text-align: center;
    color: #ffd60a;
    margin: 24px 0 18px;
}

.categories {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.category {
    min-height: 90px;
    padding: 18px 8px;
    border: 2px solid #174a78;
    border-radius: 12px;
    background: #102844;
    color: white;
    font-size: 15px;
}

.category.active {
    background: #ffc300;
    color: #001d3d;
    border-color: #ffc300;
}

.category span {
    display: block;
    font-size: 27px;
    margin-bottom: 7px;
}

.news-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin: 25px 0 15px;
}

.news-heading h2 {
    color: #ffd60a;
    font-size: 21px;
    margin: 0;
}

.refresh-btn {
    background: #ffc300;
    color: #001d3d;
}

.status {
    color: #b8d5f5;
    font-size: 13px;
    margin: 12px 0;
}

.news-card {
    background: #102844;
    border: 1px solid #21476b;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 13px;
}

.news-card a {
    color: #ffffff;
    text-decoration: none;
    font-size: 17px;
    font-weight: bold;
    line-height: 1.6;
}

.news-card a:hover {
    color: #ffd60a;
}

.news-date {
    color: #a9c4df;
    font-size: 12px;
    margin-top: 10px;
}

.empty {
    background: #102844;
    padding: 20px;
    border-radius: 10px;
    line-height: 1.7;
}

footer {
    text-align: center;
    padding: 25px 10px;
    margin-top: 35px;
    background: #001d3d;
    border-top: 2px solid #ffc300;
    color: #d6e6f5;
    line-height: 1.8;
}

footer strong {
    color: #ffd60a;
}

@media (min-width: 650px) {
    .categories {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    header h1 {
        font-size: 38px;
    }
}
</style>
</head>

<body>

<header>
    <div class="creator">Created by Sadana</div>

    <div class="logo">✈️</div>

    <h1>SKYWORLD AVIATION</h1>

    <p id="subtitle">Your World of Aviation News</p>

    <div class="languages">
        <button class="lang-btn active" id="englishBtn"
            onclick="setLanguage('en')">
            🇬🇧 English
        </button>

        <button class="lang-btn" id="sinhalaBtn"
            onclick="setLanguage('si')">
            🇱🇰 සිංහල
        </button>
    </div>
</header>

<main class="container">

    <h2 class="section-title" id="categoryTitle">
        Aviation Categories
    </h2>

    <div class="categories" id="categories"></div>

    <div class="news-heading">
        <h2 id="newsTitle">🌍 World Aviation News</h2>

        <button class="refresh-btn" onclick="loadNews()"
            id="refreshBtn">
            🔄 Refresh
        </button>
    </div>

    <div class="status" id="status">
        Loading aviation news...
    </div>

    <div id="newsList"></div>

</main>

<footer>
    <strong>SKYWORLD AVIATION</strong><br>
    <span id="footerText">Your Aviation News Website</span><br>
    © <span id="year"></span> Created by Sadana
</footer>

<script>
const categories = [
    {
        id: "world",
        icon: "🌍",
        en: "World Aviation",
        si: "ලෝක ගුවන් සේවා"
    },
    {
        id: "srilanka",
        icon: "🇱🇰",
        en: "Sri Lanka Aviation",
        si: "ශ්‍රී ලංකා ගුවන් සේවා"
    },
    {
        id: "airlines",
        icon: "✈️",
        en: "Airline News",
        si: "ගුවන් සමාගම් පුවත්"
    },
    {
        id: "aircraft",
        icon: "🛫",
        en: "Aircraft News",
        si: "ගුවන් යානා පුවත්"
    },
    {
        id: "airports",
        icon: "🏢",
        en: "Airport News",
        si: "ගුවන්තොටුපොළ පුවත්"
    },
    {
        id: "safety",
        icon: "🛡️",
        en: "Aviation Safety",
        si: "ගුවන් ආරක්ෂාව"
    }
];

let language = "en";
let selectedCategory = "world";
let newsData = {};
let translationCache = {};
let loading = false;

document.getElementById("year").textContent =
    new Date().getFullYear();


function getCategory(id) {
    return categories.find(category => category.id === id);
}


function renderCategories() {
    const box = document.getElementById("categories");

    box.innerHTML = "";

    categories.forEach(category => {
        const button = document.createElement("button");

        button.className = "category" +
            (category.id === selectedCategory ? " active" : "");

        const icon = document.createElement("span");
        icon.textContent = category.icon;

        const label = document.createElement("span");
        label.style.fontSize = "15px";
        label.style.marginBottom = "0";
        label.textContent =
            language === "si" ? category.si : category.en;

        button.appendChild(icon);
        button.appendChild(label);

        button.onclick = () => {
            selectedCategory = category.id;
            renderCategories();
            renderNews();
        };

        box.appendChild(button);
    });
}


function setLanguage(lang) {
    language = lang;

    document.documentElement.lang = lang;

    document.getElementById("englishBtn")
        .classList.toggle("active", lang === "en");

    document.getElementById("sinhalaBtn")
        .classList.toggle("active", lang === "si");

    document.getElementById("subtitle").textContent =
        lang === "si"
            ? "ඔබේ ගුවන් සේවා පුවත් ලෝකය"
            : "Your World of Aviation News";

    document.getElementById("categoryTitle").textContent =
        lang === "si"
            ? "ගුවන් සේවා වර්ග"
            : "Aviation Categories";

    document.getElementById("refreshBtn").textContent =
        lang === "si" ? "🔄 අලුත් කරන්න" : "🔄 Refresh";

    document.getElementById("footerText").textContent =
        lang === "si"
            ? "ඔබේ ගුවන් සේවා පුවත් වෙබ් අඩවිය"
            : "Your Aviation News Website";

    renderCategories();
    renderNews();
}


async function translateToSinhala(text) {
    if (!text) return "";

    if (translationCache[text]) {
        return translationCache[text];
    }

    try {
        const url =
            "https://translate.googleapis.com/translate_a/single" +
            "?client=gtx&sl=en&tl=si&dt=t&q=" +
            encodeURIComponent(text);

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Translation service unavailable");
        }

        const result = await response.json();

        const translated = result[0]
            .map(part => part[0] || "")
            .join("");

        if (translated.trim()) {
            translationCache[text] = translated;
            return translated;
        }

        return text;

    } catch (error) {
        console.log("Translation error:", error);
        return text;
    }
}


async function showTitle(title, linkElement) {
    if (language !== "si") {
        linkElement.textContent = title;
        return;
    }

    linkElement.textContent = "පරිවර්තනය කරමින්...";

    const translated = await translateToSinhala(title);

    if (linkElement.isConnected && language === "si") {
        linkElement.textContent = translated;
    }
}


function formatDate(dateText) {
    if (!dateText) return "";

    const date = new Date(dateText);

    if (isNaN(date.getTime())) {
        return dateText;
    }

    return date.toLocaleDateString(
        language === "si" ? "si-LK" : "en-GB",
        {
            year: "numeric",
            month: "short",
            day: "numeric"
        }
    );
}


async function renderNews() {
    const list = document.getElementById("newsList");
    const status = document.getElementById("status");

    const category = getCategory(selectedCategory);

    document.getElementById("newsTitle").textContent =
        category.icon + " " +
        (language === "si" ? category.si : category.en) +
        (language === "si" ? " - පුවත්" : " News");

    list.innerHTML = "";

    const articles = newsData[selectedCategory] || [];

    if (articles.length === 0) {
        status.textContent =
            language === "si"
                ? "දැනට පුවත් නැහැ. අන්තර්ජාලය පරීක්ෂා කර Refresh ඔබන්න."
                : "No news available. Check your connection and press Refresh.";

        list.innerHTML =
            '<div class="empty">' +
            (language === "si"
                ? "පුවත් පෙන්වීමට data/news.json ගොනුවේ පුවත් තිබිය යුතුයි. GitHub Actions ක්‍රියාත්මක වෙනවාදැයි පරීක්ෂා කරන්න."
                : "News must be available in data/news.json. Check whether your GitHub Actions workflow is running.") +
            '</div>';

        return;
    }

    status.textContent =
        language === "si"
            ? "පුවත් " + articles.length + " ක් හමු වුණා."
            : articles.length + " articles found.";

    articles.forEach(article => {
        const card = document.createElement("article");
        card.className = "news-card";

        const link = document.createElement("a");
        link.href = article.link || "#";
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        const title = article.title || "Aviation News";

        link.textContent = title;

        card.appendChild(link);

        if (article.date) {
            const date = document.createElement("div");
            date.className = "news-date";

            date.textContent =
                (language === "si" ? "දිනය: " : "Date: ") +
                formatDate(article.date);

            card.appendChild(date);
        }

        list.appendChild(card);

        if (language === "si") {
            showTitle(title, link);
        }
    });
}


async function loadNews() {
    if (loading) return;

    loading = true;

    const status = document.getElementById("status");

    status.textContent =
        language === "si"
            ? "පුවත් ලබාගනිමින්..."
            : "Loading aviation news...";

    try {
        const response = await fetch(
            "./data/news.json?time=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("Could not load data/news.json");
        }

        const data = await response.json();

        newsData = data;

        renderCategories();
        await renderNews();

    } catch (error) {
        console.error("News loading error:", error);

        status.textContent =
            language === "si"
                ? "පුවත් ලබාගන්න බැරි වුණා."
                : "Could not load news.";

        document.getElementById("newsList").innerHTML =
            '<div class="empty">' +
            (language === "si"
                ? "data/news.json ගොනුව තිබෙනවාදැයි පරීක්ෂා කරන්න. GitHub Actions මඟින් පුවත් ලබාගන්නා workflow එක ක්‍රියාත්මක විය යුතුයි."
                : "Check that data/news.json exists and your news workflow is running.") +
            '</div>';

    } finally {
        loading = false;
    }
}


renderCategories();
loadNews();

setInterval(loadNews, 5 * 60 * 1000);
</script>

</body>
</html>
